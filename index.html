<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isla Explora — San Andrés</title>
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Guía turística offline de San Andrés Isla: sitios turísticos, flora y fauna, y gastronomía típica.">
<style>
  :root{
    --navy:#0b1f3a; --navy2:#102a4c; --turquoise:#26c6be; --turquoise-d:#0e8f89;
    --coral:#ff6f61; --gold:#f7c55a; --cream:#fdf6e9; --text:#eaf2f6; --muted:#9fb3c8;
    --card:#132a4e; --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top, #15335c 0%, var(--navy) 60%);
    color:var(--text); min-height:100%;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    position:sticky; top:0; z-index:20;
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;
    background:linear-gradient(180deg, var(--navy) 70%, rgba(11,31,58,0));
    backdrop-filter:blur(6px);
  }
  header h1{font-size:1.4rem; display:flex; align-items:center; gap:10px;}
  header h1 .wave{color:var(--turquoise);}
  header p{color:var(--muted); font-size:.82rem; margin-top:2px;}
  .search{
    margin-top:12px; display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid #23466f; border-radius:14px; padding:10px 14px;
  }
  .search input{
    background:transparent; border:none; outline:none; color:var(--text); flex:1; font-size:.95rem;
  }
  .search input::placeholder{color:var(--muted);}
  .tabs{
    display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:9px 16px; border-radius:999px; font-size:.85rem; font-weight:600;
    background:var(--card); color:var(--muted); border:1px solid #23466f; white-space:nowrap; cursor:pointer;
    transition:.15s;
  }
  .tab.active{background:var(--turquoise); color:#06201f; border-color:var(--turquoise);}
  main{padding:16px 18px 90px;}
  .section-title{
    font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--turquoise);
    margin:18px 2px 10px; font-weight:700;
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px;}
  .card{
    background:var(--card); border-radius:var(--radius); overflow:hidden; cursor:pointer;
    border:1px solid #1d3b63; transition:transform .15s, border-color .15s;
    display:flex; flex-direction:column;
  }
  .card:active{transform:scale(.97);}
  .card .art{
    aspect-ratio:4/3; width:100%; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .card .art svg{width:70%; height:70%;}
  .fav-btn{
    position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%;
    background:rgba(11,31,58,.55); display:flex; align-items:center; justify-content:center;
    font-size:15px; border:none; cursor:pointer;
  }
  .card .info{padding:10px 12px 14px;}
  .card .info h3{font-size:.95rem; line-height:1.2;}
  .card .info span{display:block; font-size:.72rem; color:var(--muted); margin-top:3px;}
  .empty{
    text-align:center; color:var(--muted); padding:40px 20px; font-size:.9rem;
  }
  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(5,14,27,.78); z-index:50; display:none;
    align-items:flex-end; justify-content:center;
  }
  .overlay.open{display:flex;}
  .sheet{
    width:100%; max-width:560px; background:var(--navy2); border-radius:22px 22px 0 0;
    max-height:88vh; overflow-y:auto; animation:up .22s ease-out;
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  @keyframes up{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-art{
    aspect-ratio:16/9; width:100%; display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .sheet-art svg{width:45%; height:45%;}
  .close-btn{
    position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%;
    background:rgba(5,14,27,.55); border:none; color:#fff; font-size:18px; cursor:pointer;
  }
  .sheet-body{padding:20px 22px;}
  .sheet-body .cat-tag{
    display:inline-block; font-size:.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; padding:4px 10px; border-radius:999px; margin-bottom:10px;
  }
  .sheet-body h2{font-size:1.3rem; margin-bottom:4px;}
  .sheet-body .sub{color:var(--muted); font-size:.85rem; margin-bottom:14px;}
  .sheet-body p{font-size:.92rem; line-height:1.55; color:#dce8f0; margin-bottom:14px;}
  .tip-box{
    background:#0e2644; border-left:3px solid var(--gold); border-radius:10px;
    padding:12px 14px; font-size:.85rem; color:var(--cream); display:flex; gap:10px;
  }
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--navy2); border-top:1px solid #1d3b63;
    display:flex; justify-content:space-around; padding:10px 6px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .nav-btn{
    background:none; border:none; color:var(--muted); font-size:.68rem; display:flex;
    flex-direction:column; align-items:center; gap:3px; cursor:pointer; padding:4px 10px;
  }
  .nav-btn.active{color:var(--turquoise);}
  .nav-btn svg{width:22px; height:22px;}
  #installBtn{
    display:none; position:fixed; right:16px; bottom:76px; z-index:25;
    background:var(--coral); color:#fff; border:none; border-radius:999px;
    padding:11px 16px; font-size:.82rem; font-weight:700; box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  #offlineBadge{
    display:none; position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:50%;
    transform:translateX(-50%); background:var(--gold); color:#2a1d02; font-size:.75rem;
    font-weight:700; padding:5px 14px; border-radius:999px; z-index:60;
  }
  @media (prefers-color-scheme: light){
    :root{ --navy:#0b1f3a; } /* keep dark Caribbean theme regardless of system mode */
  }
</style>
</head>
<body>

<div id="offlineBadge">📡 Modo sin conexión</div>

<header>
  <h1><span class="wave">🌊</span> Isla Explora</h1>
  <p>Sitios turísticos · Flora y fauna · Gastronomía de San Andrés</p>
  <div class="search">
    <span>🔎</span>
    <input id="searchInput" type="text" placeholder="Buscar: Johnny Cay, rondón, iguana...">
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="todos">Todos</div>
    <div class="tab" data-cat="sitios">🏝️ Sitios</div>
    <div class="tab" data-cat="fauna">🦎 Flora y Fauna</div>
    <div class="tab" data-cat="comida">🦀 Gastronomía</div>
    <div class="tab" data-cat="favoritos">⭐ Favoritos</div>
  </div>
</header>

<main id="main"></main>

<button id="installBtn">⬇️ Instalar app</button>

<nav class="bottom-nav">
  <button class="nav-btn active" data-cat="todos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg>Inicio</button>
  <button class="nav-btn" data-cat="sitios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Sitios</button>
  <button class="nav-btn" data-cat="fauna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14c2-5 6-8 8-8s6 3 8 8"/><circle cx="12" cy="14" r="5"/></svg>Natura</button>
  <button class="nav-btn" data-cat="comida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v8M10 2v8M6 10a4 4 0 008 0M8 10v12"/></svg>Comida</button>
  <button class="nav-btn" data-cat="favoritos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0112 5a5.5 5.5 0 019.5 7c-2.5 4.5-9.5 9-9.5 9z"/></svg>Favoritos</button>
</nav>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

  fishfry:`<circle cx="50" cy="50" r="48" fill="var(--c)" opacity=".18"/><path d="M15 50 Q40 30 68 50 Q40 70 15 50 Z" fill="var(--c)"/><path d="M68 50 L85 40 L85 60 Z" fill="var(--c)"/><path d="M30 46 L36 50 L30 54 M42 44 L48 50 L42 56" stroke="#0b1f3a" stroke-width="2" fill="none"/>`,
  bread:`<circle cx="50" cy="50" r="48" fill="var(--c)" opacity=".18"/><ellipse cx="50" cy="55" rx="32" ry="22" fill="var(--c)"/><path d="M30 48 Q50 38 70 48 M28 58 Q50 48 72 58" stroke="#0b1f3a" stroke-width="2.5" fill="none" opacity=".5"/>`,
  sweet:`<circle cx="50" cy="50" r="48" fill="var(--c)" opacity=".18"/><circle cx="35" cy="55" r="16" fill="var(--c)"/><circle cx="60" cy="42" r="14" fill="var(--c)"/><circle cx="62" cy="65" r="12" fill="var(--c)"/>`,
};

const CAT_LABEL = {sitios:"Sitio turístico", fauna:"Flora y fauna", comida:"Gastronomía"};
const CAT_COLOR = {sitios:"#26c6be", fauna:"#ff6f61", comida:"#f7c55a"};

function iconSvg(item){
  return `<svg viewBox="0 0 100 100" style="--c:${item.color}">${ICONS[item.icon]||ICONS.palm}</svg>`;
}

// ---------- STATE ----------
let favorites = JSON.parse(localStorage.getItem("isla_favoritos")||"[]");
let currentCat = "todos";
let query = "";

function saveFavs(){ localStorage.setItem("isla_favoritos", JSON.stringify(favorites)); }
function toggleFav(id, e){
  if(e) e.stopPropagation();
  const i = favorites.indexOf(id);
  if(i>-1) favorites.splice(i,1); else favorites.push(id);
  saveFavs(); render();
}

function filteredData(){
  let list = DATA;
  if(currentCat==="favoritos") list = list.filter(d=>favorites.includes(d.id));
  else if(currentCat!=="todos") list = list.filter(d=>d.cat===currentCat);
  if(query.trim()){
    const q = query.toLowerCase();
    list = list.filter(d=> d.name.toLowerCase().includes(q) || d.sub.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q));
  }
  return list;
}

function render(){
  const main = document.getElementById("main");
  const list = filteredData();
  const groups = currentCat==="todos" && !query.trim()
    ? [["sitios","🏝️ Sitios Turísticos"],["fauna","🦎 Flora y Fauna"],["comida","🦀 Gastronomía Típica"]]
    : [[null,null]];

  let html = "";
  if(list.length===0){
    html = `<div class="empty">🌴 No encontramos resultados.<br>Prueba con otra búsqueda.</div>`;
  } else if(groups[0][0]===null){
    html = `<div class="grid">${list.map(cardHtml).join("")}</div>`;
  } else {
    groups.forEach(([cat,label])=>{
      const items = list.filter(d=>d.cat===cat);
      if(!items.length) return;
      html += `<div class="section-title">${label}</div><div class="grid">${items.map(cardHtml).join("")}</div>`;
    });
  }
  main.innerHTML = html;
  main.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("click", ()=> openSheet(c.dataset.id));
  });
  main.querySelectorAll(".fav-btn").forEach(b=>{
    b.addEventListener("click", (e)=> toggleFav(b.dataset.id, e));
  });
}

function cardHtml(d){
  const isFav = favorites.includes(d.id);
  return `<div class="card" data-id="${d.id}">
    <div class="art" style="background:linear-gradient(160deg, ${d.color}22, #0e2644)">
      ${iconSvg(d)}
      <button class="fav-btn" data-id="${d.id}">${isFav?"⭐":"☆"}</button>
    </div>
    <div class="info"><h3>${d.name}</h3><span>${d.sub}</span></div>
  </div>`;
}

function openSheet(id){
  const d = DATA.find(x=>x.id===id);
  if(!d) return;
  const isFav = favorites.includes(d.id);
  document.getElementById("sheet").innerHTML = `
    <div class="sheet-art" style="background:linear-gradient(160deg, ${d.color}33, #0b1f3a)">
      ${iconSvg(d)}
      <button class="close-btn" id="closeSheet">✕</button>
    </div>
    <div class="sheet-body">
      <span class="cat-tag" style="background:${d.color}25; color:${d.color}">${CAT_LABEL[d.cat]}</span>
      <h2>${d.name}</h2>
      <div class="sub">${d.sub}</div>
      <p>${d.desc}</p>
      <div class="tip-box"><span>💡</span><span>${d.tip}</span></div>
      <button id="favToggle" style="margin-top:16px;width:100%;padding:13px;border:none;border-radius:12px;background:${isFav?'#23466f':'var(--coral)'};color:#fff;font-weight:700;font-size:.9rem;">
        ${isFav?"★ Quitar de favoritos":"☆ Agregar a favoritos"}
      </button>
    </div>`;
  document.getElementById("overlay").classList.add("open");
  document.getElementById("closeSheet").onclick = closeSheet;
  document.getElementById("favToggle").onclick = ()=>{ toggleFav(d.id); openSheet(d.id); };
}
function closeSheet(){ document.getElementById("overlay").classList.remove("open"); }
document.getElementById("overlay").addEventListener("click",(e)=>{ if(e.target.id==="overlay") closeSheet(); });

// Tabs
function setCat(cat){
  currentCat = cat;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.cat===cat));
  document.querySelectorAll(".nav-btn").forEach(t=>t.classList.toggle("active", t.dataset.cat===cat));
  render();
}
document.querySelectorAll(".tab").forEach(t=> t.addEventListener("click", ()=> setCat(t.dataset.cat)));
document.querySelectorAll(".nav-btn").forEach(t=> t.addEventListener("click", ()=> setCat(t.dataset.cat)));
document.getElementById("searchInput").addEventListener("input",(e)=>{ query = e.target.value; render(); });

render();

// ---------- OFFLINE STATUS ----------
function updateOfflineBadge(){
  document.getElementById("offlineBadge").style.display = navigator.onLine ? "none" : "block";
}
window.addEventListener("online", updateOfflineBadge);
window.addEventListener("offline", updateOfflineBadge);
updateOfflineBadge();

// ---------- PWA INSTALL ----------
let deferredPrompt;
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault(); deferredPrompt = e;
  document.getElementById("installBtn").style.display = "block";
});
document.getElementById("installBtn").addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("installBtn").style.display = "none";
});
window.addEventListener("appinstalled", ()=>{ document.getElementById("installBtn").style.display = "none"; });

// ---------- SERVICE WORKER (offline) ----------
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
